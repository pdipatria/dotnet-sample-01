services:
  postgres-db:
    image: postgres
    container_name: postgres-db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: dotnet
      POSTGRES_DB: dotnet01
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - app-net
  rabbitmq:
    image: rabbitmq:management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    networks:
      - app-net
  my-first-service-image:
    build: .
    container_name: my-first-service
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ${HOME}/.aspnet/https:/https
    depends_on:
      - postgres-db
    networks:
      - app-net

volumes:
  pgdata:
    external: true

networks:
  app-net:
